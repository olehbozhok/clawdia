[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "clawdia"
path = "src/main.rs"

[dependencies]
runtime = { workspace = true }
tools = { workspace = true }

rig-core = { version = "0.34", features = ["rmcp"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = "0.15"
