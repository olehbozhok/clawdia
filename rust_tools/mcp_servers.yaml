# MCP Server Configuration
# Supported transport types: stdio, http

servers:
  filesystem:
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "."
    env: {}

  # Example: HTTP-based MCP server
