# MCP Server Configuration
# Supported transport types: stdio, http

servers:
  filesystem:
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "."
    env: {}

  campaign-doc:
    transport: stdio
    command: uv
    args:
      - "run"
      - "--project"
      - "../mcp/campaign-doc"
      - "python"
      - "../mcp/campaign-doc/server.py"
    env: {}

  # Example: HTTP-based MCP server
  # remote-tools:
  #   transport: http
  #   url: http://localhost:8080/mcp
  #   headers:
  #     Authorization: "Bearer ${MCP_TOKEN}"
